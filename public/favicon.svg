<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14254A" />
      <stop offset="100%" stop-color="#070E1E" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4CA78" />
      <stop offset="100%" stop-color="#C27D16" />
    </linearGradient>
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27A30" />
      <stop offset="100%" stop-color="#D45B17" />
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="16" />

  <!-- Stars -->
  <circle cx="390" cy="120" r="14" fill="#F4CA78" />
  <circle cx="120" cy="130" r="8" fill="#F4CA78" />

  <!-- Fox Ears -->
  <polygon points="170,250 130,120 220,195" fill="url(#foxFur)" />
  <polygon points="165,235 145,145 205,198" fill="#FAF6EC" />
  <polygon points="342,250 382,120 292,195" fill="url(#foxFur)" />
  <polygon points="347,235 367,145 307,198" fill="#FAF6EC" />

  <!-- Fox Head -->
  <polygon points="256,180 160,250 160,285 256,365 352,285 352,250" fill="url(#foxFur)" />
  <polygon points="160,250 215,285 256,365 210,360 160,285" fill="#FFFDF8" />
  <polygon points="352,250 297,285 256,365 302,360 352,285" fill="#FFFDF8" />

  <!-- Eyes -->
  <circle cx="215" cy="265" r="9" fill="#16284F" />
  <circle cx="212" cy="261" r="3" fill="#FFFFFF" />
  <circle cx="297" cy="265" r="9" fill="#16284F" />
  <circle cx="294" cy="261" r="3" fill="#FFFFFF" />

  <!-- Snout & Nose -->
  <ellipse cx="256" cy="335" rx="10" ry="7" fill="#1A1C24" />

  <!-- Floating Tilde / Accent Mark -->
  <path d="M 235 145 Q 256 130 277 145" stroke="#F4CA78" stroke-width="9" stroke-linecap="round" fill="none" />

  <!-- Open Book Base -->
  <path d="M 90 420 Q 256 450 422 420 L 426 445 Q 256 475 86 445 Z" fill="#C27D16" />
  <path d="M 95 400 C 160 390 230 380 254 400 L 254 430 C 230 405 160 415 95 425 Z" fill="#FAF6EC" />
  <path d="M 417 400 C 352 390 282 380 258 400 L 258 430 C 282 405 352 415 417 425 Z" fill="#FAF6EC" />
</svg>
